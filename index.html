<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <link rel="icon" type="image/png" sizes="32x32" href="favicon.svg" />
        <link rel="icon" type="image/png" sizes="16x16" href="favicon.svg" />
        <link rel="apple-touch-icon" sizes="180x180" href="favicon.svg" />
        <link rel="shortcut icon" href="favicon.svg" />

        <title>AppleGeese — Goose Games &amp; AI Projects</title>
        <meta

        <meta name="theme-color" content="#1a1a2e" />

        <meta
            property="og:title"
            content="AppleGeese — Goose Games &amp; AI Projects"
        />
        <meta
            property="og:description"
            content="Play goose-themed browser games — Farm, Goose, Idle, Orchard Warfare RTS, and Honk Defense. AI-crafted fun at applegeese.com."
        />
        <meta property="og:url" content="https://applegeese.com/" />

        <meta property="og:site_name" content="AppleGeese" />

        <meta name="twitter:card" content="summary" />
        <meta
            name="twitter:title"
            content="AppleGeese — Goose Games &amp; AI Projects"
        />
        <meta
            name="twitter:description"
            content="Play goose-themed browser games — Farm, Goose, Idle, Orchard Warfare RTS, and Honk Defense."
        />
        <meta
            name="twitter:image"
            content="https://applegeese.com/favicon.svg"
        />

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebSite",
                "name": "AppleGeese",
                "url": "https://applegeese.com/",
                "description": "A collection of goose-themed browser games and AI-crafted projects.",
                "hasPart": [
                    {
                        "@type": "VideoGame",
                        "name": "Apple Goose Farm",
                        "url": "https://applegeese.com/farm.html"
                    },
                    {
                        "@type": "VideoGame",
                        "name": "Goose Game",
                        "url": "https://applegeese.com/goose.html"
                    },
                    {
                        "@type": "VideoGame",
                        "name": "Idle Goose Game",
                        "url": "https://applegeese.com/idle.html"
                    },
                    {
                        "@type": "VideoGame",
                        "name": "Orchard Warfare",
                        "url": "https://applegeese.com/rts/"
                    },
                    {
                        "@type": "VideoGame",
                        "name": "Honk Defense",
                        "url": "https://applegeese.com/td/"
                    }
                ]
            }
        </script>

        <!-- Google Fonts for Inter -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <!-- Preload arcade soundtrack for the game -->
        <link
            rel="preload"
            href="assets/goose/arcade.mp3"
            as="audio"
            type="audio/mpeg"
        />
        <style>
            :root {
                --background-light: #f3f4f6;
                --text-light: #1a1a1a;
                --background-dark: linear-gradient(
                    135deg,
                    #1a1a2e 0%,
                    #16213e 100%
                );
                --text-dark: #e4e4e7;
            }

            html,
            body {
                height: 100%;
                width: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                user-select: none;
            }

            body {
                font-family: "Inter", sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                transition:
                    background-color 0.3s,
                    color 0.3s;
            }

            body.light-mode {
                background-color: var(--background-light);
                color: var(--text-light);
            }

            body.dark-mode {
                background: var(--background-dark);
                color: var(--text-dark);
            }

            .content-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1.5rem;
                height: 100vh;
                width: 100vw;
            }

            .visually-hidden {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
            }

            .emoji-container {
                font-size: clamp(2.5rem, 8vw, 5rem);
            }

            .fade-in {
                opacity: 0;
                animation: fadeInBounce 1s forwards;
            }

            .fade-in.delay-1 {
                animation-delay: 0.5s;
            }

            .fade-in.delay-2 {
                animation-delay: 1s;
            }

            @keyframes fadeInBounce {
                0% {
                    opacity: 0;
                    transform: translateY(30px) scale(0.95);
                }
                60% {
                    opacity: 1;
                    transform: translateY(-10px) scale(1.05);
                }
                80% {
                    transform: translateY(5px) scale(0.98);
                }
                100% {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }

            @keyframes wiggle {
                0%,
                100% {
                    transform: rotate(0deg) scale(1) translateY(0px);
                }
                10%,
                30%,
                50%,
                70%,
                90% {
                    transform: rotate(-8deg) scale(1.05) translateY(-3px);
                }
                20%,
                40%,
                60%,
                80% {
                    transform: rotate(8deg) scale(1.05) translateY(-2px);
                }
            }

            .goose-emoji.wiggle-animation {
                animation: wiggle 0.6s ease-in-out 1;
                display: inline-block;
                transform-origin: center center;
            }

            .mr-4 {
                margin-right: 1rem;
            }

            .goose-slot {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 1.15em;
                height: 1.15em;
                vertical-align: middle;
            }

            .goose-link {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                height: 100%;
                text-decoration: none;
                cursor: pointer;
                transition: filter 0.15s ease, transform 0.15s ease;
            }

            .goose-link:hover {
                filter: brightness(1.15);
                transform: translateY(-2px);
            }

            .goose-link:hover .goose-emoji.wiggle-animation {
                animation: none;
            }

            .game-nav {
                display: flex;
                gap: 0.5rem;
                opacity: 0;
                transform: translateY(-10px);
                pointer-events: none;
                transition:
                    opacity 0.6s ease,
                    transform 0.6s ease;
            }

            .game-nav.visible {
                opacity: 1;
                transform: translateY(0);
                pointer-events: auto;
            }

            .game-nav-link {
                text-decoration: none;
                font-size: 0.8rem;
                font-weight: 600;
                padding: 0.35rem 0.9rem;
                border-radius: 999px;
                letter-spacing: 0.03em;
                transition:
                    background-color 0.2s,
                    color 0.2s,
                    transform 0.15s ease;
            }

            body.light-mode .game-nav-link {
                background-color: rgba(0, 0, 0, 0.07);
                color: var(--text-light);
            }

            body.dark-mode .game-nav-link {
                background-color: rgba(255, 255, 255, 0.1);
                color: var(--text-dark);
            }

            .game-nav-link:hover {
                transform: scale(1.05);
            }

            body.light-mode .game-nav-link:hover {
                background-color: rgba(0, 0, 0, 0.13);
            }

            body.dark-mode .game-nav-link:hover {
                background-color: rgba(255, 255, 255, 0.18);
            }
        </style>
    </head>

    <body>
        <!-- Main Content Section -->
        <main class="content-container">
            <div class="visually-hidden">
                <h1>AppleGeese</h1>
                <p>
                    Goose-themed games — Farm, Goose, Idle, Orchard Warfare RTS,
                    and Honk Defense
                </p>
            </div>
            <nav class="game-nav" id="gameNav">
                <a href="farm.html" class="game-nav-link">Farm</a>
                <a href="goose.html" class="game-nav-link">Goose</a>
                <a href="idle.html" class="game-nav-link">Idle</a>
                <a href="rts/" class="game-nav-link">RTS</a>
                <a href="td/" class="game-nav-link">TD</a>
            </nav>
            <div class="emoji-container" id="emojiContainer">
                <span class="mr-4 fade-in delay-1" id="apple"
                    ><a href="about.html" style="text-decoration: none"
                        >🍎</a
                    ></span
                >
                <span class="fade-in delay-2" id="geese">
                    <span class="goose-slot"
                        ><a href="farm.html" class="goose-link"
                            ><span class="goose-emoji">🪿</span></a
                        ></span
                    ><span class="goose-slot"
                        ><a
                            href="goose.html"
                            class="goose-link"
                            id="playableGoose"
                            ><span class="goose-emoji" id="wiggleGoose"
                                >🪿</span
                            ></a
                        ></span
                    ><span class="goose-slot"
                        ><a href="idle.html" class="goose-link"
                            ><span class="goose-emoji">🪿</span></a
                        ></span
                    >                    <span class="goose-slot"
                        ><a href="rts/" class="goose-link"
                            ><span class="goose-emoji">🪿</span></a
                        ></span
                    ><span class="goose-slot"
                        ><a href="td/" class="goose-link"
                            ><span class="goose-emoji">🪿</span></a
                        ></span
                    >
                </span>
            </div>
        </main>

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const PREVIEW_DELAY_MS = 15000;
                const body = document.body;

                function updateTheme() {
                    if (
                        window.matchMedia("(prefers-color-scheme: dark)")
                            .matches
                    ) {
                        body.classList.remove("light-mode");
                        body.classList.add("dark-mode");
                    } else {
                        body.classList.remove("dark-mode");
                        body.classList.add("light-mode");
                    }
                }

                // Set initial theme based on system preference
                updateTheme();

                // Listen for changes in the system color scheme
                window
                    .matchMedia("(prefers-color-scheme: dark)")
                    .addEventListener("change", updateTheme);

                // Show game nav above geese after 15 seconds
                setTimeout(() => {
                    const gameNav = document.getElementById("gameNav");
                    if (gameNav) {
                        gameNav.classList.add("visible");
                    }
                }, PREVIEW_DELAY_MS);

                // Wiggle the playable goose emoji (inner span, not the link)
                setInterval(() => {
                    const wiggleGoose = document.getElementById("wiggleGoose");
                    const playableGoose =
                        document.getElementById("playableGoose");

                    if (
                        wiggleGoose &&
                        playableGoose &&
                        !playableGoose.matches(":hover")
                    ) {
                        wiggleGoose.classList.add("wiggle-animation");

                        setTimeout(() => {
                            wiggleGoose.classList.remove("wiggle-animation");
                        }, 600);
                    }
                }, 2000);
            });
        </script>
    </body>
</html>

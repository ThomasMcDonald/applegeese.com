        <link
            rel="preload"
            href="assets/goose/arcade.mp3"

                "name": "AppleGeese",
                "url": "https://applegeese.com/",
                "description": "A collection of goose-themed browser games and AI-crafted projects.",

                    {

                    {
                        "@type": "VideoGame",

                        "url": "https://applegeese.com/idle.html"

            <div class="emoji-row" id="emojiRow">
                <span class="fade-in delay-1">
                    <button
                        class="apple-button"
                        id="appleButton"
                        type="button"
                        aria-label="Feed the geese"
                    >
                        🍎
                    </button>
                </span>
                <span class="geese fade-in delay-2">
                    <a class="goose-link" href="farm.html">

                    </a>
                    <a class="goose-link" href="goose.html" id="playableGoose">
                        <span
                            class="goose-emoji"
                            id="wiggleGoose"
                            aria-hidden="true"

                        >
                        <span class="goose-name">Goose</span>
                    </a>
                    <a class="goose-link" href="idle.html">
                        <span class="goose-emoji" aria-hidden="true">🪿</span>

                    </a>

                        <span class="goose-emoji" aria-hidden="true">🪿</span>
